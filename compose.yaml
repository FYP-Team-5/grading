name: rubric-grading

services:
  api:
    build:
      context: .
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_KEY: ${API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      RAG_URL: ${RAG_URL:-http://host.docker.internal:8000}
      RAG_API_KEY: ${RAG_API_KEY:-}
      RAG_TIMEOUT_SECONDS: ${RAG_TIMEOUT_SECONDS:-30}
      RAG_MAX_RETRIES: ${RAG_MAX_RETRIES:-2}
      RETRIEVAL_K: ${RETRIEVAL_K:-8}
      RETRIEVAL_SCORE_THRESHOLD: ${RETRIEVAL_SCORE_THRESHOLD:-}
      LLM_URL: ${LLM_URL:-http://host.docker.internal:11434/v1/chat/completions}
      LLM_MODEL: ${LLM_MODEL:-local-model}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-1}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2000}
      MAX_ANSWER_CHARACTERS: ${MAX_ANSWER_CHARACTERS:-50000}
    ports:
      - "${API_PORT:-8001}:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8001/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
